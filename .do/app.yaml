# DigitalOcean App Platform spec — https://docs.digitalocean.com/products/app-platform/reference/app-spec/
# Create:  doctl apps create --spec .do/app.yaml
# Update:  doctl apps update <app-id> --spec .do/app.yaml
#
# Static site: `npm run build` exports plain HTML/CSS/JS into out/ (next.config.ts → output: 'export').
name: dukla-web
region: fra

static_sites:
  - name: web
    github:
      repo: MichalJankura/dukla
      branch: main
      deploy_on_push: true
    environment_slug: node-js
    build_command: npm run build
    # Must be set: App Platform would otherwise pick up public/ (images only).
    output_dir: out
    error_document: 404.html
    envs:
      # NEXT_PUBLIC_* are baked into the HTML at build time.
      - key: NEXT_PUBLIC_SITE_URL
        value: https://duklaclub.me
        scope: BUILD_TIME
      - key: NEXT_PUBLIC_VARIANT
        value: afterglow
        scope: BUILD_TIME
      - key: NEXT_PUBLIC_SHOW_VARIANT_SWITCH
        value: 'true'
        scope: BUILD_TIME

domains:
  - domain: duklaclub.me
    type: PRIMARY
  - domain: www.duklaclub.me
    type: ALIAS
